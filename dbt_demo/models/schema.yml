version: 2

models:

  - name: stg_orders
    columns:

      - name: order_id
        tests:
          - not_null
          - unique

      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')  # Ensure user_id exists in stg_users
              field: user_id
      - name: total_amount
        tests:
          - not_null

  - name: stg_users
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

      - name: user_name
        tests:
          - not_null
          - unique
      - name: email
        tests:
          - not_null
          - unique

  - name: fct_orders
    columns:

      - name: order_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_orders')  # Ensure order_id exists in stg_orders
              field: order_id
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')  # Ensure user_id exists in stg_users
              field: user_id

      - name: total_amount
        tests:
          - not_null